# The offline suite (166 tests, well under a minute) gates every push to main
# and every pull request. It needs the full runtime stack because both `main`
# modules import torch/transformers, so CPU-only torch goes in first from the
# PyTorch CPU wheel index; letting requirements.txt pull the default wheel would
# drag in the CUDA build and blow the runner's disk.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            train/requirements.txt
            pyproject.toml

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the repo and its requirements
        # flash-attn stays optional: it needs a GPU toolchain and --no-build-isolation.
        run: pip install -e '.[test]' -r requirements.txt -r train/requirements.txt

      - name: Run the offline suite
        # Run from outside the repo root: `python -m pytest` prepends the cwd to
        # sys.path, so from the root the source tree -- not the editable install --
        # would satisfy every import, and a broken pyproject would still look green.
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests"
